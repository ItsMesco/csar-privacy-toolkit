[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
hash-engine = { path = "../hash-engine" }
ledger-core = { path = "../ledger-core" }


image = "0.23.14"
pdqhash = "0.1.1"


rs_merkle = "1.5"

# Zero-Knowledge Proofs (arkworks / Groth16)
ark-ff = "0.6"
ark-ec = "0.6"
ark-relations = "0.6"
ark-r1cs-std = "0.6"
ark-groth16 = "0.6"
ark-snark = "0.6"
ark-bn254 = { version = "0.6", features = ["curve"] }
ark-std = "0.6"

# Utility
rand = "0.8"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
rsa = "0.9"

reqwest = { version = "0.13.4", features = ["json"] }
chrono = "0.4.45"
rusqlite = { version = "0.40.2", features = ["bundled"] }
bincode = "1.3"
uuid = { version = "1.25.0", features = ["v4"] }
tokio = { version= "1.53.1", features = ["full"] }
base64 = "0.23.1"
ark-serialize = "0.6.0"
serde_json = "1.0.151"

[features]
default = ["std"]
std = ["ark-std/std", "ark-ff/std", "ark-ec/std"]
