[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
ledger-core = {path= "../ledger-core"}
ark-bn254 = { version = "0.6.0", default-features = false, features = ["curve"] }
ark-ec = { version = "0.6.0", default-features = false }
ark-ff = { version = "0.6.0", default-features = false }
ark-groth16 = { version = "0.6.0", default-features = false, features = ["r1cs"] }
ark-relations = { version = "0.6.0", default-features = false }
ark-serialize = "0.6.0"
ark-std = { version = "0.6.0", default-features = false, features = ["std"] }
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
hash-engine = { version = "0.1.0", path = "../hash-engine" }
rs_merkle = "1.5.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["full"] }
