[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework (Axum 0.8) e Runtime
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1.40", features = ["full"] }

# Serializzazione e Logging
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Dipendenze per il Server Audit Ledger (Merkle Tree & SQLite)
rusqlite = { version = "0.40.2", features = ["bundled"] }
rs_merkle = "1.4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"

# --- Dipendenze per la verifica ZKP (Groth16) ---
ark-ff = "0.6"
ark-ec = "0.6"
ark-groth16 = "0.6"
ark-snark = "0.6"
ark-bn254 = { version = "0.6", features = ["curve"] }
ark-std = "0.6"
ark-serialize = "0.6"
ark-r1cs-std = "0.6"
ark-relations = "0.6"


base64 = "0.23.0"
rand = "0.8"