[package]
name = "ledger-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rs_merkle = "1.5"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
